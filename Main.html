<!DOCTYPE html>
<html>
<body>

<button onclick="launch()">Launch</button>

<script>
const FILE_URL =
"https://cdn.jsdelivr.net/gh/EFAB2014/Eaglercraft@main/game.xml?v=5";

async function launch() {

    const response = await fetch(FILE_URL);
    const text = await response.text();

    // parse XML
    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    // get HTML content
const contentNode =
xml.querySelector("Content");

const html =
contentNode.childNodes[0].nodeValue;

    // open new page
    const win = window.open("", "_blank");

    // inject HTML
    win.document.open();
    win.document.write(html);
    console.log(html);
    win.document.close();

    // fullscreen
    win.onload = () => {
        win.document.documentElement.requestFullscreen();
    };
}
</script>

</body>
</html>
